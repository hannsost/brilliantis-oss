[package]
name = "brilliantis-neurofunken"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "NeuroFunken composition and integrations for Brilliantis"

[dependencies]
brilliantis = { path = "../..", version = "0.2.0" }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1.0.150"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }

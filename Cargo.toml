[workspace]
members = ["distributions/neurofunken"]
default-members = ["."]
resolver = "2"

[package]
name = "brilliantis"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Lightweight, agent-first CRM and ERP with standalone and NeuroFunken distributions"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "io-util", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = "1.2.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1.23.3", features = ["v4"] }
argon2 = "0.5.3"
sha2 = "0.10.9"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22.1"
jsonwebtoken = "9.3.1"
roxmltree = "0.21.1"
encoding_rs = "0.8.35"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
libc = "0.2.186"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
